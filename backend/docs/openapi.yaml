openapi: 3.1.0
info:
  title: Mini ERP API
  version: 1.0.0
  description: Feature-first Go backend for a single company, multiple warehouses and IDR. Decimal money and quantity values
    are JSON strings. Authentication uses bearer access tokens and single-use refresh tokens. Business transitions are dedicated
    actions. Posting actions require Idempotency-Key and replay successful results for 24 hours per actor and operation.
servers:
- url: /api/v1
security:
- bearerAuth: []
tags:
- name: Auth
- name: Identity
- name: Master Data
- name: Purchasing
- name: Inventory
- name: Sales
- name: Finance
- name: Reports
- name: System
paths:
  /auth/login:
    post:
      operationId: login
      tags:
      - Auth
      summary: login
      parameters: []
      responses:
        '200':
          description: Success
          headers:
            X-Request-ID:
              schema:
                type: string
                format: uuid
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/TokenResponse'
                additionalProperties: false
        '400':
          description: Malformed JSON, query or missing idempotency key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Invalid or expired authentication
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Permission, ownership, warehouse scope or separation of duties denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Resource not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '405':
          description: Method not supported
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Invalid state, insufficient stock or reservation, overpayment, duplicate or idempotency conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Request validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal error; no database details exposed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Required dependency unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
