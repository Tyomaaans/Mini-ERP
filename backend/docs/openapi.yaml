components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    CreateSalesOrderRequest:
      type: object
      additionalProperties: false
      properties:
        customer_id:
          type: string
          format: uuid
        warehouse_id:
          type: string
          format: uuid
        order_date:
          type: string
          format: date
        discount_amount:
          type: string
          pattern: ^(0|[1-9][0-9]{0,15})(\.[0-9]{1,2})?$
        notes:
          anyOf:
          - type: string
          - type: 'null'
        items:
          type: array
          items:
            $ref: '#/components/schemas/LineInput'
          minItems: 1
          maxItems: 1000
      required:
      - customer_id
      - warehouse_id
      - order_date
      - items
    UpdateSalesOrderRequest:
      type: object
      additionalProperties: false
      properties:
        customer_id:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
        warehouse_id:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
        order_date:
          anyOf:
          - type: string
            format: date
          - type: 'null'
        discount_amount:
          anyOf:
          - type: string
            pattern: ^(0|[1-9][0-9]{0,15})(\.[0-9]{1,2})?$
          - type: 'null'
        notes:
          anyOf:
          - type: string
          - type: 'null'
        items:
          type: array
          items:
            $ref: '#/components/schemas/LineInput'
          minItems: 1
          maxItems: 1000
    SalesOrderDecisionRequest:
      type: object
      additionalProperties: false
      properties:
        note:
          type: string
          maxLength: 1000
          minLength: 1
      required:
      - note
    SalesOrderResponse:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        so_number:
          type: string
        customer_id:
          type: string
          format: uuid
        warehouse_id:
          type: string
          format: uuid
        status:
          type: string
          enum:
          - DRAFT
          - CONFIRMED
          - PARTIALLY_SHIPPED
          - SHIPPED
          - CANCELLED
        order_date:
          type: string
          format: date
        confirmed_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
        subtotal:
          type: string
          pattern: ^(0|[1-9][0-9]*)\.[0-9]{2}$
        discount_amount:
          type: string
          pattern: ^(0|[1-9][0-9]*)\.[0-9]{2}$
        total_amount:
          type: string
          pattern: ^(0|[1-9][0-9]*)\.[0-9]{2}$
        notes:
          anyOf:
          - type: string
          - type: 'null'
        created_by:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        items:
          type: array
          items:
            $ref: '#/components/schemas/SalesOrderOrderItemResponse'
      required:
      - id
      - so_number
      - customer_id
      - warehouse_id
      - status
      - order_date
      - confirmed_at
      - subtotal
      - discount_amount
      - total_amount
      - notes
      - created_by
      - created_at
      - updated_at
      - items
    SalesOrderOrderItemResponse:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        product_id:
          type: string
          format: uuid
        quantity:
          type: string
          pattern: ^-?(0|[1-9][0-9]*)\.[0-9]{3}$
        unit_price:
          type: string
          pattern: ^(0|[1-9][0-9]*)\.[0-9]{2}$
