root = "."
tmp_dir = "tmp"

[build]
cmd = "go build -o /tmp/erp ."
entrypoint = ["/tmp/erp"]
include_ext = ["go", "sql", "yaml", "html"]
exclude_dir = ["tmp", ".cache", "bin", "vendor", ".git"]
exclude_regex = ["_test\\.go"]
delay = 1000
stop_on_error = true
send_interrupt = true
kill_delay = 10000000000

[log]
time = true

[misc]
clean_on_exit = false
