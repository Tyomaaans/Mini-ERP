services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: integration-postgres-password
      POSTGRES_DB: erp_test
    tmpfs: [/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-d", "erp_test"]
      interval: 2s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    tmpfs: [/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 20

  test:
    build:
      context: .
      dockerfile: Dockerfile.dev
    command: ["go", "test", "-race", "-count=1", "-v", "./..."]
    environment:
      TEST_DATABASE_URL: postgres://postgres:integration-postgres-password@postgres:5432/erp_test?sslmode=disable
      TEST_REDIS_ADDR: redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
